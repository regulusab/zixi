<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>八字論子息：子女數目與男女</title>
<meta name="description" content="輸入生辰，依子平古籍論子息：時支子星十二長生、長生沐浴歌各本對照、生成之數、一殺一子、陰陽日時、官煞與食傷條件，以及大運流年提示，每條附古籍出處。">
<meta property="og:title" content="八字論子息"><meta property="og:type" content="website">
<meta property="og:url" content="https://regulusab.github.io/zixi/">
<meta name="theme-color" content="#2b2320">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="https://regulusab.github.io/nav/nav.js" defer></script>
</head><body>
<header class="top"><h1>八字論子息</h1><p class="sub">子女數目・男女・時機　每條附古籍出處</p></header>
<main>
<section id="form" class="card noprint">
  <h2>生辰資料</h2>
  <div class="row"><span class="lab">性別</span>
    <label class="rb"><input type="radio" name="g" value="m" checked> 男命</label>
    <label class="rb"><input type="radio" name="g" value="f"> 女命</label></div>
  <div class="row"><label for="date">出生日期</label><input id="date" type="date" value="1990-01-01"></div>
  <div class="row"><label for="time">出生時間</label><input id="time" type="time" value="12:00">
    <label class="rb"><input type="checkbox" id="unk"> 時辰不確定（列出每個時辰的結果）</label></div>
  <div class="row"><label for="city">出生地點</label><select id="city"></select></div>
  <div class="row"><label for="lon">經度</label><input id="lon" type="number" step="0.0001" inputmode="decimal"><span class="hint inl">東經為正、西經為負</span></div>
  <p class="hint">命理時間一律用地方平時：輸入的日期時間即地方平時，照輸入使用，不換算、不扣夏令；交節氣換成出生地經度的地方平時（世界時＋經度×4 分）定年柱、月柱；日柱 0:00 換日；東經 70° 以西日柱干支進一位（日期不動），時柱依新日干以五鼠遁重排。</p>
  <div class="go"><button type="button" id="go" class="pri big">論子息</button></div>
</section>

<section id="result" hidden></section>

<section id="poemCard" class="card">
  <details open><summary>長生沐浴歌：原文、各本異文與用法</summary><div id="poem"></div></details>
</section>
<section id="about" class="card">
  <details><summary>本站說明與資料來源</summary><div id="sources"></div></details>
</section>
</main>
<footer class="foot">內容僅供參考・古籍原文照錄，未改用字</footer>
<script src="app.js"></script>
</body></html>
